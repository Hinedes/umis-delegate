{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% translate "Open shift" %} · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="form-shell" data-ui="shift-open-shell">
    <h1 class="form-title">{% translate "Open shift" %}</h1>
    <div class="card-core" data-ui="shift-open-fields">
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'core/partials/form_fields.html' %}
                <div class="form-actions">
                    <a href="{% url 'shift_list' %}" class="btn-core btn-secondary">{% translate "Cancel" %}</a>
                    <button type="submit" class="btn-core btn-primary">{% translate "Open" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
